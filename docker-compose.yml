version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: commudle_pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commudle_safe_search
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

name: commudle-safe-search

# Everything in one command:   docker compose up --build
#   UI  -> http://localhost:8501     API docs -> http://localhost:8000/docs
# Database only (used by scripts/launch.py):   docker compose up -d --wait db

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: commudle_pgvector
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commudle_safe_search
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commudle_safe_search"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/commudle_safe_search
      GROQ_API_KEY: ${GROQ_API_KEY:-}          # optional: rule-based extraction works without it
      CORS_ORIGINS: http://localhost:8501
      ENABLE_TRACE: "true"                       # demo: show the pipeline + SQL in the UI (off by default elsewhere)
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
    command: sh -c "python -m seed.load_dummy_dataset --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WORKERS:-2}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  ui:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    command: streamlit run demo/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    ports:
      - "8501:8501"

volumes:
  pgdata:

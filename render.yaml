# Render Blueprint — backend API (FastAPI in Docker).
# Render dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on creation.
services:
  - type: web
    name: commudle-search-api
    runtime: docker
    plan: free                 # 512 MB: the image skips the embedding model (filters + ranking still work)
    branch: sankalp
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL      # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: GROQ_API_KEY      # optional: without it the rule-based extractor answers
        sync: false
      - key: CORS_ORIGIN_REGEX # the React UI on Vercel (production + preview URLs)
        value: https://.*\.vercel\.app
      - key: ENABLE_EMBEDDINGS
        value: "false"
      - key: ENABLE_TRACE      # Workflow page's SQL view. Demo only — it reveals schema details.
        value: "true"
      - key: ENABLE_WEB_SEARCH
        value: "true"

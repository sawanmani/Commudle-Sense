[pytest]
testpaths = tests
markers =
    semantic: uses the real embedding model (skipped if sentence-transformers is missing)
    db: needs a reachable Postgres+pgvector (DATABASE_URL); auto-skipped otherwise
    integration: hits the live Groq API (needs GROQ_API_KEY); excluded by default. Run with: pytest -m integration
addopts = -m "not integration" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
